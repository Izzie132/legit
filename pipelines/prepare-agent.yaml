steps:
  - task: DockerInstaller@0
    inputs:
      dockerVersion: '17.09.0-ce'
  - task: PowerShell@2
    displayName: 'Spin up SQL Server in a Docker container'
    inputs:
      filePath: './build.ps1'
      arguments: 'CreateDatabaseDockerContainer'
  - task: PowerShell@2
    displayName: 'Create test database'
    inputs:
      filePath: './build.ps1'
      arguments: 'CreateTestDatabase'