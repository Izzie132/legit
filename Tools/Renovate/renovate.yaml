schedules:
  - cron: "0 3 * * *"
    displayName: "Every day at 3AM"
    branches:
      include: [main]
    always: true

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: "Use Node 20.x"
    inputs:
      versionSource: "spec"
      versionSpec: "20.x"
  - bash: |
      git config --global user.email 'bot@renovateapp.com'
      git config --global user.name 'Renovate Bot'
      npx renovate
    env:
      TOKEN: $(System.AccessToken)
      GITHUB_COM_TOKEN: $(gitHubPersonalAccessToken)
      RENOVATE_CONFIG_FILE: "./Tools/Renovate/config.js"
      LOG_LEVEL: "debug"
