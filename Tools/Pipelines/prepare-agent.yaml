steps:
  - task: DockerInstaller@0
    inputs:
      dockerVersion: "17.09.0-ce"
  - task: UseDotNet@2
    inputs:
      packageType: "sdk"
      useGlobalJson: true
  - task: PowerShell@2
    displayName: "Spin up SQL Server in a Docker container"
    inputs:
      filePath: "./build.ps1"
      arguments: "CreateDatabaseContainer"
  - task: PowerShell@2
    displayName: "Create test database"
    inputs:
      filePath: "./build.ps1"
      arguments: "CreateTestDatabase"
  - task: PowerShell@2
    displayName: "Generate NuGet package list"
    inputs:
      filePath: "./Tools/Audit/GenerateNuGetPackageList.ps1"
